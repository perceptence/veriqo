<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <!--
    Source for apple-touch-icon.png (rasterised, not served directly — iOS
    only reads PNG here). At 180px there is room for the real mark, so this
    is the full six-facet `prism` from src/components/Logo.jsx, rim light and
    highlight included.

    No grain, though it is on every other surface in the product. Rendered at
    180px it moved each channel by a mean of 0.36/255 (max 6) while taking the
    PNG from 3.6kB to 38kB — a 10.6x file for a difference that isn't visible
    before iOS even downscales this to 60pt.

    Full bleed and square-cornered on purpose: iOS applies its own superellipse
    mask, so baking in our own radius would round it twice.
  -->
  <rect width="180" height="180" fill="#141210"/>

  <!-- Flat hexagon under the facets: they all meet at the centre, and this
       keeps antialiasing seams from showing the ink through. -->
  <polygon points="90,39.6 133.68,64.8 133.68,115.2 90,140.4 46.32,115.2 46.32,64.8" fill="#15A06A"/>

  <polygon points="90,90 46.32,64.8 90,39.6" fill="#3BE7A4"/>
  <polygon points="90,90 90,39.6 133.68,64.8" fill="#22C588"/>
  <polygon points="90,90 133.68,64.8 133.68,115.2" fill="#15A06A"/>
  <polygon points="90,90 133.68,115.2 90,140.4" fill="#0A5E3E"/>
  <polygon points="90,90 90,140.4 46.32,115.2" fill="#084E34"/>
  <polygon points="90,90 46.32,115.2 46.32,64.8" fill="#128A5C"/>

  <polygon points="90,39.6 133.68,64.8 133.68,115.2 90,140.4 46.32,115.2 46.32,64.8"
           fill="none" stroke="#46F0AE" stroke-width="2.6" opacity="0.5"/>
  <polygon points="90,90 46.32,64.8 90,39.6" fill="#FFFFFF" opacity="0.14"/>
</svg>
